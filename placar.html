<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>TRUE BJJ · Placar</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&display=swap">
<style>
:root{--bg:#000;--fg:#f2f0ec;--mut:#8b8884;--line:#2a2928;--red:#d3202b;--grn:#2e9e5b;--amb:#e0a020;--blu:#4a78b8;--panel:#111;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:'Oswald','Arial Narrow',Impact,sans-serif;-webkit-tap-highlight-color:transparent;user-select:none}
main{max-width:480px;margin:0 auto;padding:12px 16px 32px}
header{display:flex;align-items:center;gap:14px;padding:4px 0 10px;border-bottom:1px solid #262626}
header img{height:84px;width:auto;display:block}
header b{font-size:22px;letter-spacing:.16em;font-weight:700}
header span{display:block;font-size:12px;color:var(--mut);letter-spacing:.08em}
button{font:inherit;color:var(--fg);background:transparent;border:1px solid #333;border-radius:2px;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
[hidden]{display:none!important}
#clock{margin-top:12px;border:1px solid #333;border-radius:2px;text-align:center;padding:6px 0 12px}
#st{font-size:16px;letter-spacing:.2em;color:var(--mut)}
#clock.run{border-color:var(--grn)} #clock.run #st{color:var(--grn)}
#clock.low{border-color:var(--red)} #clock.low #st{color:var(--red)}
#clock.end{border-color:var(--fg)}
#t{font-size:clamp(84px,26vw,128px);font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
#ctl{display:flex;gap:10px;margin-top:10px}
#ctl button{height:60px;font-size:22px;font-weight:700;letter-spacing:.14em}
#go{flex:1.6;background:var(--red);border-color:var(--red)} #rz{flex:1}
#res{margin-top:10px;padding:12px;border:1px solid var(--fg);text-align:center;font-size:20px;letter-spacing:.06em}
#res small{display:block;font-size:14px;color:var(--mut);letter-spacing:.1em}
.ath{margin-top:10px;border:1px solid #333;border-left:6px solid var(--c);padding:10px 12px}
#r-a{--c:var(--fg)} #r-b{--c:var(--blu)}
.ath.win{border-color:var(--c);background:#0c0c0c}
.ath.lose{opacity:.55}
.top{display:flex;align-items:center;gap:8px}
.who{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
input,select{font:inherit;color:var(--fg);background:transparent;border:0;border-bottom:1px solid #333;border-radius:0;min-width:0;width:100%;padding:4px 0}
.nm{font-size:22px;font-weight:600;letter-spacing:.04em} .tm{font-size:15px;color:var(--mut)}
.nums{display:flex;align-items:flex-end;gap:10px}
.nums div{text-align:center;display:flex;flex-direction:column}
.nums b{line-height:1;font-variant-numeric:tabular-nums}
.pt b{font-size:88px;font-weight:700;min-width:1.1ch} .mini b{font-size:42px;font-weight:600}
.nums small{font-size:12px;letter-spacing:.14em;color:var(--mut)}
.mini.hot b{color:var(--red)}
.btns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.btns button{height:52px;font-size:22px;font-weight:600}
.btns button[data-a=V],.btns button[data-a=P],.btns button[data-a=S]{font-size:16px;letter-spacing:.06em}
section{margin-top:18px;border-top:1px solid var(--line);padding-top:14px}
h2{margin:0 0 10px;font-size:14px;font-weight:600;letter-spacing:.2em;color:var(--mut)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.row label{font-size:18px} .row select{width:auto;font-size:22px;border:1px solid #333;padding:8px 10px;background:#000}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.acts button{flex:1 1 40%;height:46px;font-size:16px;letter-spacing:.06em}
#nova{color:#ff6b73}
footer{margin-top:20px;text-align:center;font-size:12px;color:var(--mut);letter-spacing:.08em;line-height:1.6}
#ex{position:fixed;right:12px;bottom:12px;height:44px;padding:0 16px;opacity:.6;background:#000}
body.wide main{max-width:none;display:grid;grid-template-columns:auto 1fr auto;gap:6px 12px;align-items:center;padding:6px 12px 14px}
body.wide header{grid-column:1;border-bottom:0;padding:0}
body.wide header img{height:calc(var(--h,100vh)*.17);min-height:44px}
body.wide header div{display:none}
body.wide #clock{grid-column:2;margin:0;padding:2px 0 6px}
body.wide #t{font-size:clamp(52px,calc(var(--h,100vh)*.2),120px)} body.wide #st{font-size:13px}
body.wide #ctl{grid-column:3;margin:0;flex-direction:column;gap:6px}
body.wide #ctl button{height:calc(var(--h,100vh)*.1);min-height:38px;font-size:18px;padding:0 14px}
body.wide #res{grid-column:1/-1;margin:0;padding:6px;font-size:17px}
body.wide #bd{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:10px}
body.wide .ath{margin:0;padding:8px 10px}
body.wide .btns{grid-template-columns:repeat(6,1fr);gap:6px;margin-top:8px}
body.wide .btns button{height:calc(var(--h,100vh)*.12);min-height:40px;font-size:18px;padding:0}
body.wide .btns button[data-a=V],body.wide .btns button[data-a=P],body.wide .btns button[data-a=S]{font-size:12px;letter-spacing:0}
body.wide .pt b{font-size:clamp(52px,calc(var(--h,100vh)*.2),110px)} body.wide .mini b{font-size:clamp(28px,calc(var(--h,100vh)*.1),52px)}
body.wide .nm{font-size:20px}
body.wide #cfg{grid-column:1/-1;margin:0;padding-top:8px;display:flex;align-items:center;gap:12px}
body.wide #cfg h2{display:none}
body.wide #cfg .acts{flex:1;flex-wrap:nowrap;margin:0}
body.wide #cfg .acts button{flex:1 1 0;height:42px;font-size:14px;padding:0 6px;letter-spacing:0}
body.wide footer{grid-column:1/-1;margin:0;font-size:11px}
.home{display:block;text-align:right;font-size:12px;letter-spacing:.12em;color:var(--mut);text-decoration:none;padding:4px 2px 0}
.home:hover,.home:focus-visible{color:var(--fg)}
body.wide .home{grid-column:1/-1;margin:0;padding:0}
body.board .home{display:none}
body.board main{height:var(--h,100vh);padding-top:46px;overflow:hidden}
body.board header,body.board #cfg,body.board footer{display:none}
body.board:not(.wide) main{max-width:none;display:flex;flex-direction:column}
body.board:not(.wide) #clock{padding:0 0 4px;margin-top:0}
body.board:not(.wide) #t{font-size:min(calc(var(--w)*.24),calc(var(--h)*.13))}
body.board:not(.wide) #ctl button{height:calc(var(--h)*.075);min-height:40px}
body.board:not(.wide) #bd{flex:1;display:flex;flex-direction:column;gap:8px;min-height:0}
body.board:not(.wide) .ath{flex:1;margin:0;display:flex;flex-direction:column;justify-content:space-between;min-height:0}
body.board:not(.wide) .pt b{font-size:min(calc(var(--w)*.28),calc(var(--h)*.14))}
body.board:not(.wide) .mini b{font-size:min(calc(var(--w)*.12),calc(var(--h)*.07))}
body.board:not(.wide) .btns button{height:calc(var(--h)*.07);min-height:40px}
body.board:not(.wide) .nm{font-size:min(calc(var(--w)*.06),calc(var(--h)*.035))}
body.rot main{position:fixed;top:0;left:0;width:var(--w);height:var(--h);transform:rotate(90deg) translateY(-100%);transform-origin:top left;overflow:auto}
#ex,#rt{position:fixed;top:calc(env(safe-area-inset-top,0px) + 6px);height:38px;padding:0 16px;opacity:.6;background:#000;z-index:40}
#ex{right:12px} #rt{right:84px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<script>
(function(){
var $=function(s){return document.querySelector(s)};
var KEY='truebjj-placar-v1';
var S={a:{n:'',t:'TRUE BJJ',pts:0,adv:0,pen:0},b:{n:'',t:'',pts:0,adv:0,pen:0},sub:null,fin:false,dur:300};
try{var sv=JSON.parse(localStorage.getItem(KEY)||'null');if(sv){S.a.n=sv.an||'';S.a.t=sv.at||'';S.b.n=sv.bn||'';S.b.t=sv.bt||'';var d=+sv.dur;S.dur=(d>=120&&d<=600&&d%60===0)?d:300}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify({an:S.a.n,at:S.a.t,bn:S.b.n,bt:S.b.t,dur:S.dur}))}catch(e){}}
function oth(k){return k==='a'?'b':'a'}
function eff(k){var x=S[k],o=S[oth(k)];return{pts:x.pts+(o.pen>=3?2:0),adv:x.adv+(o.pen>=2?1:0)}}
function dq(){return S.a.pen>=4?'a':S.b.pen>=4?'b':null}
function nome(k){return S[k].n.trim()||('Atleta '+(k==='a'?1:2))}
function mmss(s){s=Math.max(0,Math.ceil(s));return ('0'+Math.floor(s/60)).slice(-2)+':'+('0'+s%60).slice(-2)}

/* som */
var ac=null;
function bell(n){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();
 for(var k=0;k<n;k++){var t=ac.currentTime+k*.42;
  [[1,.6],[2.76,.3],[5.4,.14],[8.93,.07]].forEach(function(p){var o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=620*p[0];
   g.gain.setValueAtTime(p[1],t);g.gain.exponentialRampToValueAtTime(.0005,t+(k===n-1?2.2:1)/Math.sqrt(p[0]));o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+2.8)})}}catch(e){}}
function vib(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}

/* atletas */
function row(k){var n=k==='a'?1:2;
 return '<div class="ath" id="r-'+k+'"><div class="top"><div class="who"><input class="nm" id="n-'+k+'" placeholder="Atleta '+n+'" maxlength="22" aria-label="Nome do atleta '+n+'"><input class="tm" id="t-'+k+'" placeholder="Equipe" maxlength="22" aria-label="Equipe do atleta '+n+'"></div>'+
 '<div class="nums"><div class="pt"><b id="p-'+k+'">0</b><small>PTS</small></div><div class="mini"><b id="v-'+k+'">0</b><small>V</small></div><div class="mini" id="xm-'+k+'"><b id="x-'+k+'">0</b><small>P</small></div></div></div>'+
 '<div class="btns">'+['2','3','4','V','P','S'].map(function(a){var l={V:'+ Vant.',P:'+ Pun.',S:'Finaliz.'}[a]||'+'+a;return '<button data-k="'+k+'" data-a="'+a+'">'+l+'</button>'}).join('')+'</div></div>'}
$('#bd').innerHTML=row('a')+row('b');
['a','b'].forEach(function(k){
 $('#n-'+k).value=S[k].n;$('#t-'+k).value=S[k].t;
 $('#n-'+k).oninput=function(){S[k].n=this.value;save();render()};
 $('#t-'+k).oninput=function(){S[k].t=this.value;save()}});

/* histórico */
var hist=[];
function snap(){hist.push(JSON.stringify([[S.a.pts,S.a.adv,S.a.pen],[S.b.pts,S.b.adv,S.b.pen],S.sub,S.fin]))}
function act(k,a){
 if(S.sub||S.fin||dq())return;
 snap();var x=S[k];
 if(a==='V')x.adv++;else if(a==='P')x.pen=Math.min(4,x.pen+1);else if(a==='S'){S.sub=k;bell(3)}else x.pts+=+a;
 if(dq())bell(3);
 vib(60);render()}
$('#bd').onclick=function(e){var b=e.target.closest('button');if(b)act(b.dataset.k,b.dataset.a)};
$('#undo').onclick=function(){
 var h=hist.pop();if(!h)return;var d=JSON.parse(h);
 S.a.pts=d[0][0];S.a.adv=d[0][1];S.a.pen=d[0][2];S.b.pts=d[1][0];S.b.adv=d[1][1];S.b.pen=d[1][2];S.sub=d[2];S.fin=d[3];render()};

/* resultado */
function result(){
 var d=dq();if(d)return{w:oth(d),how:'Desclassificação do adversário'};
 if(S.sub)return{w:S.sub,how:'Finalização'};
 if(!S.fin)return null;
 var A=eff('a'),B=eff('b');
 if(A.pts!==B.pts)return{w:A.pts>B.pts?'a':'b',how:'Pontos · '+Math.max(A.pts,B.pts)+' x '+Math.min(A.pts,B.pts)};
 if(A.adv!==B.adv)return{w:A.adv>B.adv?'a':'b',how:'Vantagens · '+Math.max(A.adv,B.adv)+' x '+Math.min(A.adv,B.adv)};
 if(S.a.pen!==S.b.pen)return{w:S.a.pen<S.b.pen?'a':'b',how:'Menos punições'};
 return{w:null,how:'Empate · decisão do árbitro'}}

/* cronômetro */
var run=false,rem=S.dur*1000,end=0,iv=null;
function stop(){clearInterval(iv);run=false}
function tick(){rem=end-Date.now();if(rem<=0){rem=0;stop();S.fin=true;bell(3);vib([200,100,200])}render()}
$('#go').onclick=function(){
 bell(0);
 if(S.fin||S.sub||dq()||rem<=0)return;
 if(run)stop();else{end=Date.now()+rem;iv=setInterval(tick,100);run=true}
 render()};
$('#rz').onclick=function(){stop();rem=S.dur*1000;if(!S.sub&&!dq())S.fin=false;render()};
$('#fin').onclick=function(){if(S.fin||S.sub||dq())return;snap();stop();S.fin=true;bell(3);render()};
$('#nova').onclick=function(){stop();['a','b'].forEach(function(k){S[k].pts=S[k].adv=S[k].pen=0});S.sub=null;S.fin=false;hist=[];rem=S.dur*1000;render()};
var sel=$('#dur');for(var m=2;m<=10;m++){var o=document.createElement('option');o.value=m*60;o.textContent=m+' min';sel.appendChild(o)}
sel.value=S.dur;
sel.onchange=function(){if(run){sel.value=S.dur;return}S.dur=+sel.value;rem=S.dur*1000;S.fin=false;save();render()};

/* tela cheia / horizontal */
function fit(){var b=document.body,r=b.classList.contains('rot'),w=r?innerHeight:innerWidth,hh=r?innerWidth:innerHeight;
 b.style.setProperty('--w',w+'px');b.style.setProperty('--h',hh+'px');b.classList.toggle('wide',w>hh)}
addEventListener('resize',function(){fit()});addEventListener('orientationchange',function(){setTimeout(fit,150)});
function board(on,land){var b=document.body.classList;b.toggle('board',on);$('#ex').hidden=!on;$('#rt').hidden=!on;
 if(!on){b.remove('rot');try{screen.orientation.unlock()}catch(e){}try{document.fullscreenElement&&document.exitFullscreen()}catch(e){}fit();return}
 var p;try{p=document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen()}catch(e){}

/* tela acesa enquanto o relógio roda ou o placar está em tela cheia */
var wl=null,wlReq=false;
function wakeSync(){
 var want=run||document.body.classList.contains('board');
 try{
  if(want&&!wl&&!wlReq&&navigator.wakeLock){wlReq=true;navigator.wakeLock.request('screen').then(function(l){wlReq=false;wl=l;l.addEventListener('release',function(){if(wl===l)wl=null})}).catch(function(){wlReq=false})}
  else if(!want&&wl){var l=wl;wl=null;l.release().catch(function(){})}
 }catch(e){wlReq=false}
}
document.addEventListener('visibilitychange',function(){if(!document.hidden)wakeSync()});

 $('#cfg .row').style.opacity=run?.4:1;
 $('#rot').textContent=(document.body.classList.contains('rot')||document.fullscreenElement)?'Voltar na vertical':'Virar na horizontal';
 document.title=(run?mmss(s)+' · ':'')+'TRUE BJJ';
 wakeSync();
}
fit();render();
