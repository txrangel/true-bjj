<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>TRUE BJJ · Início</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&display=swap">
<style>
:root{--bg:#000;--fg:#f2f0ec;--mut:#8b8884;--line:#2a2928;--red:#d3202b;--grn:#2e9e5b;--panel:#111;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:'Oswald','Arial Narrow',Impact,sans-serif;-webkit-tap-highlight-color:transparent}
main{max-width:480px;min-height:100vh;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 24px) 16px calc(env(safe-area-inset-bottom,0px) + 24px);display:flex;flex-direction:column}
header{text-align:center;padding:12px 0 8px;border-bottom:1px solid #262626}
header img{height:120px;width:auto;display:block;margin:0 auto}
header h1{margin:12px 0 0;font-size:30px;letter-spacing:.16em;font-weight:700}
header p{margin:6px 0 0;font-size:13px;letter-spacing:.14em;color:var(--mut)}
nav{margin-top:28px;display:flex;flex-direction:column;gap:14px;flex:1}
.card{position:relative;display:flex;flex-direction:column;justify-content:center;flex:1;min-height:150px;padding:20px 56px 20px 24px;background:var(--panel);border:1px solid #333;border-radius:2px;color:var(--fg);text-decoration:none;transition:border-color .2s,background .2s}
.card:hover{border-color:var(--fg);background:#161616}
.card:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
.card.timer{border-left:6px solid var(--grn)}
.card.placar{border-left:6px solid var(--red)}
.card b{font-size:48px;font-weight:700;letter-spacing:.12em;line-height:1}
.card span{margin-top:10px;font-size:15px;letter-spacing:.1em;color:var(--mut)}
.card i{position:absolute;right:20px;top:50%;transform:translateY(-50%);font-style:normal;font-size:32px;color:var(--mut)}
footer{margin-top:24px;text-align:center;font-size:12px;color:var(--mut);letter-spacing:.1em}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
