<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>TRUE BJJ · Timer</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&display=swap">
<style>
:root{--bg:#000;--fg:#f2f0ec;--mut:#8b8884;--line:#2a2928;--red:#d3202b;--grn:#2e9e5b;--amb:#e0a020;--panel:#111;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:'Oswald','Arial Narrow',Impact,sans-serif;-webkit-tap-highlight-color:transparent;user-select:none}
main{max-width:480px;margin:0 auto;padding:12px 16px 32px}
header{display:flex;align-items:center;gap:14px;padding:4px 0}
header img{height:84px;width:auto;display:block}
header b{font-size:22px;letter-spacing:.14em;font-weight:700}
header span{display:block;font-size:12px;color:var(--mut);letter-spacing:.08em}
#stage{margin-top:10px;border:2px solid var(--line);border-radius:6px;padding:18px 12px 20px;text-align:center;transition:border-color .2s,background .2s}
#stage.fight{border-color:var(--grn)} #stage.rest{border-color:var(--amb)} #stage.warn{border-color:var(--red);background:#1c0507} #stage.done{border-color:var(--fg)}
#phase{font-size:26px;font-weight:600;letter-spacing:.2em;color:var(--mut)}
.fight #phase{color:var(--grn)} .rest #phase{color:var(--amb)} .warn #phase{color:var(--red)}
#time{font-size:clamp(84px,27vw,132px);font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
#round{font-size:20px;color:var(--mut)}
#bar{height:6px;background:var(--line);margin:14px 6px 0;border-radius:3px;overflow:hidden}
#bar i{display:block;height:100%;width:0;background:var(--fg);transition:width .2s linear}
#ctl{display:flex;gap:10px;margin-top:14px}
button{font:inherit;color:var(--fg);background:var(--panel);border:2px solid var(--line);border-radius:6px;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
#ctl button{flex:1;height:68px;font-size:24px;font-weight:700;letter-spacing:.12em}
#main{background:var(--red);border-color:var(--red)}
#stop{flex:.7}
[hidden]{display:none!important}
section{margin-top:18px;border-top:2px solid var(--line);padding-top:14px}
h2{margin:0 0 10px;font-size:18px;font-weight:600;letter-spacing:.1em}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0}
.row label{font-size:18px}
.step{display:flex;align-items:center;gap:6px}
.step button{width:48px;height:48px;font-size:26px;line-height:1}
.step output{min-width:78px;text-align:center;font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}
.prof{display:flex;gap:8px}
select,input[type=text]{flex:1;min-width:0;height:48px;font:inherit;font-size:18px;color:var(--fg);background:var(--panel);border:2px solid var(--line);border-radius:6px;padding:0 10px}
#star{width:48px;font-size:24px}
#star.on{color:var(--amb);border-color:var(--amb)}
.acts{display:flex;gap:8px;margin-top:10px}
.acts button{flex:1;height:46px;font-size:16px;letter-spacing:.06em}
#del{color:#ff6b73}
#msg{min-height:20px;margin-top:8px;font-size:15px;color:var(--mut);text-align:center}
.lock{opacity:.4;pointer-events:none}
footer{margin-top:22px;text-align:center;font-size:13px;color:var(--mut);letter-spacing:.1em}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.val{min-width:116px;height:50px;font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}
#pk{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.78);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:480px;background:var(--panel);border:2px solid var(--line);border-bottom:0;border-radius:12px 12px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.cols{display:flex;gap:10px}
.cw{flex:1;text-align:center;font-size:15px;color:var(--mut)}
.col{position:relative;height:260px;overflow-y:auto;margin-top:6px;border:2px solid var(--line);border-radius:6px;background:#000;overscroll-behavior:contain}
.col button{display:block;width:100%;height:50px;border:0;border-radius:0;background:transparent;font-size:24px;font-variant-numeric:tabular-nums}
.col button.on{background:var(--red);font-weight:700}
#stage{padding:0 0 16px;border-width:3px;overflow:hidden;background:linear-gradient(#0d0d0d,#000)}
#band,#tvb{display:flex;justify-content:space-between;align-items:center;background:var(--line);transition:background .2s}
#band{padding:8px 14px}
.fight #band,#tv.fight #tvb{background:var(--grn)} .rest #band,#tv.rest #tvb{background:var(--amb);color:#000} .warn #band,#tv.warn #tvb{background:var(--red)} .done #band,#tv.done #tvb{background:var(--fg);color:#000}
#band #phase{color:inherit;font-size:22px;letter-spacing:.18em}
#band #round{color:inherit;font-size:20px;font-weight:600}
#time{font-size:clamp(96px,31vw,150px);padding-top:6px;text-shadow:0 0 28px rgba(255,255,255,.14)}
#dots,#tvd{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;min-height:8px;margin-top:4px}
#dots i,#tvd i{width:26px;height:8px;border-radius:2px;background:var(--line)}
#dots i.d,#tvd i.d{background:var(--fg)} #dots i.c,#tvd i.c{background:var(--red)}
#tv{position:fixed;inset:0;z-index:30;background:#000;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
#tvb{gap:16px;justify-content:flex-start;padding:10px 24px;font-size:clamp(22px,5vmin,48px);font-weight:600;letter-spacing:.16em}
#tvb img{height:clamp(44px,9vmin,90px)} #tvp{flex:1}
#tvt{flex:1;display:flex;align-items:center;justify-content:center;font-size:min(44vw,58vh);font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
#tv.warn #tvt{color:var(--red)}
#tvd{padding-bottom:24px;gap:1.6vmin} #tvd i{width:6vmin;height:1.6vmin}
#tvx{position:absolute;right:12px;bottom:12px;opacity:.55;height:44px;padding:0 16px}
#tvc{position:absolute;inset:0;z-index:2;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;font-size:22px}
#tvin{flex:none;width:200px;text-align:center;font-size:40px;letter-spacing:.2em;height:70px}
#code{margin-top:10px;text-align:center;font-size:42px;font-weight:700;letter-spacing:.25em}
#code small{display:block;font-size:14px;letter-spacing:.04em;font-weight:400;color:var(--mut)}
button{border-radius:10px} #stage{border-radius:12px;transition:border-color .4s,background .4s} #band,#tvb{transition:background .4s}
#stage.prep{border-color:#4a78b8} .prep #band,#tv.prep #tvb{background:#4a78b8}
#band #phase{font-weight:600;letter-spacing:.14em} #time{text-shadow:none;font-weight:600}
#stage.warn{background:#170607} #main{box-shadow:none}

body{background-image:none}
header{border-bottom:1px solid #262626;padding-bottom:10px}
header b{font-size:22px;letter-spacing:.16em}
#stage{border-width:1px;border-radius:2px;background:#000;box-shadow:none;padding-bottom:18px}
#stage.fight{--ph:var(--grn)} #stage.rest{--ph:var(--amb)} #stage.warn{--ph:var(--red)} #stage.prep{--ph:#4a78b8} #stage.done{--ph:var(--fg)}
#tv.fight{--ph:var(--grn)} #tv.rest{--ph:var(--amb)} #tv.warn{--ph:var(--red)} #tv.prep{--ph:#4a78b8} #tv.done{--ph:var(--fg)}
#stage #band,#stage.fight #band,#stage.rest #band,#stage.warn #band,#stage.prep #band,#stage.done #band{background:transparent;color:var(--fg);border-bottom:1px solid #262626}
#tv.fight #tvb,#tv.rest #tvb,#tv.warn #tvb,#tv.prep #tvb,#tv.done #tvb{background:transparent;color:var(--fg)}
#stage #phase,#tv #tvp{color:var(--ph,var(--mut))}
#band #phase{font-size:20px;letter-spacing:.2em;font-weight:600} #band #round{font-size:18px;font-weight:500;color:var(--mut)}
#time{font-family:'Oswald','Arial Narrow',Impact,sans-serif;font-weight:700;font-size:clamp(96px,30vw,150px);letter-spacing:0;text-shadow:none}
#tvt{font-family:inherit;font-size:min(44vw,58vh)} #tvb{font-family:inherit;font-size:clamp(22px,5vmin,48px)}
#dots i,#tvd i{height:4px;border-radius:0;transform:none}
#bar{height:2px;border-radius:0} #bar i{background:var(--fg);box-shadow:none}
button,select,input[type=text]{border-radius:2px}
#ctl button,.acts button,.val,#tvgo{clip-path:none;border-radius:2px}
button{border:1px solid #333;background:transparent}
#ctl button{font-family:inherit;font-size:22px;letter-spacing:.14em}
#stop{background:transparent}
.val{font-family:inherit;font-size:24px}
.acts button{font-size:16px}
h2{font-family:inherit;font-size:14px;letter-spacing:.2em;color:var(--mut)}
footer{font-family:inherit;font-size:12px;letter-spacing:.16em}
#code{font-family:inherit}
#tvt{font-size:min(calc(var(--w,100vw)*.44),calc(var(--h,100vh)*.58))}
body.rot #tv{inset:auto;top:0;left:0;width:var(--w);height:var(--h);transform:rotate(90deg) translateY(-100%);transform-origin:top left}
#tvg{position:absolute;right:84px;bottom:12px;opacity:.55;height:44px;padding:0 16px}
#tv{overflow:hidden}
#tvt{min-height:0;font-size:min(calc(var(--w,100vw)*.4),calc(var(--h,100vh)*.4))}
#tv.rest{--ph:var(--red)}
#tvbar{flex:none;display:flex;flex-wrap:wrap;gap:8px;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px))}
#tvph{flex:1 1 100%;min-height:clamp(44px,9vmin,80px);display:flex;align-items:center;justify-content:center;background:var(--ph,#3a3a3a);color:#fff;font-size:clamp(22px,5.6vmin,52px);font-weight:700;letter-spacing:.2em;text-align:center;transition:background .3s}
#tv.done #tvph{color:#000}
@media (min-aspect-ratio:1/1){#tvph{flex:1 1 0}}
#tvbt,#tvmisc{display:flex;gap:8px}
#tvbt{flex:1 1 auto} #tvbt button{flex:1}
#tvbt button,#tvmisc button{height:clamp(44px,9vmin,72px);padding:0 clamp(10px,2.4vmin,24px);font-size:clamp(14px,3vmin,22px);font-weight:700;letter-spacing:.06em;position:static;opacity:1}
.home{display:block;text-align:right;font-size:12px;letter-spacing:.12em;color:var(--mut);text-decoration:none;padding:4px 2px 0}
.home:hover,.home:focus-visible{color:var(--fg)}
</style>
</head>

var S={profiles:base,def:'p1'};
try{var raw=localStorage.getItem(KEY);if(raw){var p=JSON.parse(raw);if(p&&p.profiles&&p.profiles.length){S=p}}}catch(e){}
S.profiles.forEach(function(p){if(p.prep==null)p.prep=5});
var cur=S.profiles.filter(function(p){return p.id===S.def})[0]||S.profiles[0];
var cfg=Object.assign({},cur);
function persist(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function mmss(s){s=Math.max(0,Math.ceil(s));return ('0'+Math.floor(s/60)).slice(-2)+':'+('0'+s%60).slice(-2)}
function msg(t){$('#msg').textContent=t;clearTimeout(msg.t);msg.t=setTimeout(function(){$('#msg').textContent=''},2500)}

/* áudio */
var ac=null;
function beep(f,d,v){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();
 var o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.type='triangle';g.gain.value=(v||.25)*1.5;o.connect(g);g.connect(ac.destination);
 o.start();g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.stop(ac.currentTime+d)}catch(e){}}
function bell(n){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();
 for(var k=0;k<n;k++){var t=ac.currentTime+k*.42;
  [[1,.6],[2.76,.3],[5.4,.14],[8.93,.07]].forEach(function(p){var o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=620*p[0];
   g.gain.setValueAtTime(p[1],t);g.gain.exponentialRampToValueAtTime(.0005,t+(k===n-1?2.2:1)/Math.sqrt(p[0]));o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+2.8)})}}catch(e){}}
function horn(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();
 var t=ac.currentTime;
 [[1,.55],[2,.18],[3.01,.08]].forEach(function(p){var o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=784*p[0];
  g.gain.setValueAtTime(p[1],t);g.gain.exponentialRampToValueAtTime(.0005,t+1.6/p[0]);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+1.7)})}catch(e){}}
function vib(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}
var wl=null;
function lock(){if(wl)return;try{navigator.wakeLock&&navigator.wakeLock.request('screen').then(function(l){wl=l;l.addEventListener('release',function(){if(wl===l)wl=null})}).catch(function(){})}catch(e){}}
function unlock(){try{wl&&wl.release();wl=null}catch(e){}}

/* estado do timer */
var st='ready',ph='round',r=1,rem=0,endAt=0,iv=null,lastSec=-1;
function total(){return ph==='prep'?cfg.prep:(ph==='round'?cfg.round:cfg.rest)}
function render(){
  var stage=$('#stage'),s=Math.ceil(rem/1000);
  var cls='';
  if(st==='ready'){ph='round';s=cfg.round;$('#phase').textContent='PRONTO'}
  else if(st==='done'){cls='done';s=0;$('#phase').textContent='FIM'}
  else{
    cls=ph==='prep'?'prep':ph==='round'?'fight':'rest';
    if(ph==='round'&&cfg.warn>0&&s<=cfg.warn&&st==='run')cls='warn';
    $('#phase').textContent=(st==='pause'?'PAUSADO · ':'')+(ph==='prep'?'PREPARAR':ph==='round'?'LUTA':'DESCANSO');
  }
  stage.className=cls;
  $('#time').textContent=mmss(s);
  $('#round').textContent=st==='done'?'Treino concluído':'Round '+r+' de '+cfg.rounds;
  var t=total();$('#bar i').style.width=(st==='ready'||st==='done'||!t?0:Math.min(100,(1-rem/1000/t)*100))+'%';
  $('#main').textContent=st==='run'?'PAUSAR':st==='pause'?'RETOMAR':'INICIAR';
  $('#main').style.background=st==='run'?'var(--panel)':'var(--red)';
  $('#main').style.borderColor=st==='run'?'var(--line)':'var(--red)';
  $('#stop').hidden=(st==='ready'||st==='done');
  $('#cfg').classList.toggle('lock',st==='run'||st==='pause');
  document.title=(st==='run'||st==='pause'?mmss(s)+' · ':'')+'TRUE BJJ';
  var v={cls:cls,p:$('#phase').textContent,rt:$('#round').textContent,s:s,r:r,n:cfg.rounds,st:st};
  $('#dots').innerHTML=dh(v);if(tvm==='local')paintTV(v);bc(v);
}
function run(){endAt=Date.now()+rem;clearInterval(iv);iv=setInterval(tick,100);st='run';lock();render()}
function nextPhase(){
  var ended=ph;
  if(ph==='prep'){ph='round';rem=cfg.round*1000;horn();vib(150);lastSec=-1;endAt=Date.now()+rem;return}
  if(ph==='round'){
    if(r>=cfg.rounds){finish();return}
    if(cfg.rest>0){ph='rest';rem=cfg.rest*1000}else{r++;rem=cfg.round*1000}
  }else{r++;ph='round';rem=cfg.round*1000}
  if(ended==='round')bell(3);else horn();vib(150);lastSec=-1;endAt=Date.now()+rem;
}
function finish(){clearInterval(iv);st='done';rem=0;bell(3);vib([150,100,150]);unlock();render()}
function tick(){
  rem=endAt-Date.now();
  if(rem<=0){nextPhase();if(st==='done')return}
  var s=Math.ceil(rem/1000);
  if(s!==lastSec){lastSec=s;
    if(ph==='round'&&cfg.warn>0&&s<=cfg.warn&&s>0)beep(s<=3?1000:700,.12,.25);
    else if(ph==='prep'&&s>0)beep(s<=1?900:660,.14,.25);
    else if(ph==='rest'&&s<=3&&s>0)beep(1320,.08,.3)}
  render();
}
function start(){r=1;ph='round';lastSec=-1;if(cfg.prep>0){ph='prep';rem=cfg.prep*1000}else{ph='round';rem=cfg.round*1000;horn()}run()}
$('#main').onclick=function(){
  beep(1,.01,.001);
  if(st==='ready'||st==='done')start();
  else if(st==='run'){clearInterval(iv);st='pause';rem=Math.max(0,endAt-Date.now());render()}
  else if(st==='pause')run();
};
$('#stop').onclick=function(){clearInterval(iv);st='ready';r=1;rem=0;unlock();render()};

/* placar / TV */
var tvm=null,rm=null,code='',unsub=null;
function dh(v){var o='';for(var i=1;i<=v.n;i++){o+='<i class="'+(v.st==='done'||i<v.r?'d':(i===v.r&&v.st!=='ready'?'c':''))+'"></i>'}return o}
function paintTV(v){$('#tv').className=v.cls;$('#tvph').textContent=v.p;$('#tvbt').hidden=tvm!=='local';$('#tvmain').textContent=v.st==='run'?'PAUSAR':v.st==='pause'?'RETOMAR':'INICIAR';$('#tvr').textContent=v.rt;$('#tvt').textContent=mmss(v.s);$('#tvd').innerHTML=dh(v)}
function bc(v){if(!rm)return;var k=v.st+v.p+v.r+v.s;if(bc.k===k)return;bc.k=k;
  try{rm.emit('state',{code:code,cls:v.cls,p:v.p,rt:v.rt,s:v.s,r:v.r,n:v.n,st:v.st}).catch(function(){})}catch(e){}}
function getRoom(cb){if(!(window.claude&&claude.use)){cb(null);return}claude.use('room').then(cb,function(){cb(null)})}
function fit(){var b=document.body,r=b.classList.contains('rot'),w=r?innerHeight:innerWidth,hh=r?innerWidth:innerHeight;
  b.style.setProperty('--w',w+'px');b.style.setProperty('--h',hh+'px')}
addEventListener('resize',fit);
function openTV(land){$('#tv').hidden=false;$('#tv').className='';$('#tvb img').src=document.querySelector('header img').src;
  var p;try{p=document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen()}catch(e){}
  fit();
  if(land===true){Promise.resolve(p).then(function(){return screen.orientation.lock('landscape')}).catch(function(){if(innerHeight>innerWidth){document.body.classList.add('rot');fit()}})}}
$('#loc').onclick=function(){tvm='local';openTV();render()};
$('#loc2').onclick=function(){tvm='local';openTV(true);render()};
$('#tvg').onclick=function(){document.body.classList.toggle('rot');fit()};
$('#tvmain').onclick=function(){$('#main').click()};
$('#tvst').onclick=function(){$('#stop').click()};
$('#tvrs').onclick=function(){$('#stop').click();$('#main').click()};
$('#tvt').onclick=function(){if(tvm==='local')$('#main').click()};
$('#tvx').onclick=function(){tvm=null;$('#tv').hidden=true;$('#tvc').hidden=true;if(unsub){unsub();unsub=null}
  document.body.classList.remove('rot');try{screen.orientation.unlock()}catch(e){}fit();
  try{document.fullscreenElement&&document.exitFullscreen()}catch(e){}};
$('#bcast').onclick=function(){
  if(rm){rm=null;code='';$('#code').innerHTML='';$('#bcast').textContent='Transmitir para TV';return}
  getRoom(function(r0){
    if(!r0){msg('Transmissão indisponível neste dispositivo');return}
    rm=r0;code=String(1000+Math.floor(Math.random()*9000));bc.k='';
    $('#bcast').textContent='Parar transmissão';
    $('#code').innerHTML=code+'<small>Abra este mesmo link na TV, toque em Receber (TV) e digite o código.</small>';render()})};
function openRx(){tvm='remote';openTV();$('#tvc').hidden=false;$('#tvin').value='';$('#tvs').textContent=''}
$('#rcv').onclick=openRx;
$('#tvgo').onclick=function(){
  var c=$('#tvin').value.trim();if(c.length<4){$('#tvs').textContent='Digite os 4 números';return}
  $('#tvs').textContent='Conectando…';
  getRoom(function(r0){
    if(!r0){$('#tvs').textContent='Não foi possível conectar. Abra o link no navegador da TV com sua conta.';return}
    if(unsub)unsub();
    unsub=r0.on('state',function(m){var d=m.data;if(!d||d.code!==c)return;$('#tvc').hidden=true;paintTV(d)});
    $('#tvs').textContent='Aguardando o celular iniciar a transmissão…'})};

/* perfis */
function fill(){
  var sel=$('#sel');sel.innerHTML='';
  S.profiles.forEach(function(p){var o=document.createElement('option');o.value=p.id;o.textContent=(p.id===S.def?'★ ':'')+p.name;sel.appendChild(o)});
  sel.value=cur.id;$('#name').value=cfg.name;
  $('#star').classList.toggle('on',cur.id===S.def);
}
function vals(){
  $('#o-round').textContent=mmss(cfg.round);
  $('#o-rest').textContent=cfg.rest?mmss(cfg.rest):'Sem';
  $('#o-rounds').textContent=cfg.rounds;
  $('#o-prep').textContent=cfg.prep?cfg.prep+' s':'Sem';
  $('#o-warn').textContent=cfg.warn?cfg.warn+' s':'Off';
}
var TT={prep:'Preparação antes do round',round:'Tempo de luta',rest:'Tempo de descanso',rounds:'Número de rounds',warn:'Aviso nos segundos finais'};
var pk={k:null,a:0,b:0};
function col(el,n,off,sel,fmt,cb){
  el.innerHTML='';
  for(var i=0;i<n;i++){(function(v){var b=document.createElement('button');b.textContent=fmt(v);if(v===sel)b.className='on';
    b.onclick=function(){cb(v);[].forEach.call(el.children,function(c){c.className=''});b.className='on'};el.appendChild(b)})(i+off)}
  var s=el.children[sel-off];if(s)el.scrollTop=s.offsetTop-el.clientHeight/2+25;
}
function two(n){return ('0'+n).slice(-2)}
function openPk(k){
  pk.k=k;$('#pkt').textContent=TT[k];$('#pk').hidden=false;
  if(k==='round'||k==='rest'){
    pk.a=Math.floor(cfg[k]/60);pk.b=cfg[k]%60;
    $('#w2').hidden=false;$('#h1').textContent='minutos';$('#h2').textContent='segundos';
    col($('#c1'),k==='round'?31:11,0,pk.a,two,function(v){pk.a=v});
    col($('#c2'),60,0,pk.b,two,function(v){pk.b=v});
  }else{
    var lo=k==='rounds'?1:0,hi=k==='rounds'?30:30;
    pk.a=cfg[k];$('#w2').hidden=true;$('#h1').textContent=k==='rounds'?'rounds':'segundos (0 = desligado)';
    col($('#c1'),hi-lo+1,lo,pk.a,function(v){return k==='warn'&&v===0?'Off':v},function(v){pk.a=v});
  }
}
$('#pkc').onclick=function(){$('#pk').hidden=true};
$('#pk').onclick=function(e){if(e.target===this)this.hidden=true};
$('#pko').onclick=function(){
  var k=pk.k;
  if(k==='round'||k==='rest'){var t=pk.a*60+pk.b;if(k==='round'&&t<5){t=5;msg('Luta mínima: 5 s')}cfg[k]=t}else cfg[k]=pk.a;
  $('#pk').hidden=true;vals();render()};
document.querySelectorAll('.val').forEach(function(b){b.onclick=function(){openPk(b.dataset.k)}});
$('#name').oninput=function(){cfg.name=this.value};
$('#sel').onchange=function(){
  cur=S.profiles.filter(function(p){return p.id===this.value},this)[0];cfg=Object.assign({},cur);fill();vals();render()};
$('#save').onclick=function(){
  cfg.name=($('#name').value||'').trim()||'Perfil';
  Object.assign(cur,cfg);persist();fill();msg('Perfil salvo')};
$('#new').onclick=function(){
  var nm=($('#name').value||'').trim()||'Novo perfil';
  if(S.profiles.some(function(p){return p.name===nm}))nm+=' 2';
  var p=Object.assign({},cfg,{id:'p'+Date.now(),name:nm});
  S.profiles.push(p);cur=p;cfg=Object.assign({},p);persist();fill();msg('Perfil criado')};
$('#del').onclick=function(){
  if(S.profiles.length<2){msg('Mantenha ao menos um perfil');return}
  S.profiles=S.profiles.filter(function(p){return p.id!==cur.id});
  if(S.def===cur.id)S.def=S.profiles[0].id;
  cur=S.profiles[0];cfg=Object.assign({},cur);persist();fill();vals();render();msg('Perfil excluído')};
$('#star').onclick=function(){S.def=cur.id;persist();fill();msg('Definido como padrão')};
document.addEventListener('visibilitychange',function(){if(!document.hidden&&st==='run')lock()});

if(location.hash==='#tv')openRx();
fill();vals();render();
})();
</script>
</body>
</html>
